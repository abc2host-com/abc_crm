<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>American Brand Code – CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--or:#EE5400;--or2:#c94700;--cream:#FDF1D3;--dk:#2a1d14;--bg:#f4efe6;--card:#fff;--tx:#2a1d14;--mut:#8a7b6c;--ln:#eadfce;--gr:#1fa65a;--rd:#d8283b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--card:#272019;--tx:#f5ead6;--mut:#b09f8b;--ln:#3a2f25}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.logo{background:var(--or);color:var(--cream);font-family:Anton,Impact,sans-serif;line-height:.95;padding:5px 9px;border-radius:4px;font-size:15px;letter-spacing:.5px;display:inline-block}
.logo b{display:block;font-weight:400}.logo .bar{display:inline-block;width:3px;height:.9em;background:var(--cream);margin:0 3px;vertical-align:-1px}
nav{background:var(--dk);display:flex;align-items:center;gap:6px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav a{color:#e9dcc6;text-transform:uppercase;font-size:12.5px;padding:9px 13px;cursor:pointer;border-radius:3px;font-weight:500}
nav a.on{background:var(--or);color:#fff}nav .sp{flex:1}
.btn{background:var(--or);color:#fff;border:0;padding:9px 16px;border-radius:3px;cursor:pointer;font-weight:500}.btn:hover{background:var(--or2)}
.btn.g{background:var(--gr)}.btn.s{padding:6px 10px;font-size:12px}.btn.o{background:transparent;color:var(--or);border:1px solid var(--or)}
.srch{display:flex}.srch input{border:0;padding:9px 12px;border-radius:3px 0 0 3px;width:170px;background:#fff;color:#222}.srch button{border-radius:0 3px 3px 0}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px;display:grid;grid-template-columns:1fr 300px;gap:20px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.srch input{width:120px}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 14px;font-weight:500}h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.st{background:var(--or);color:var(--cream);padding:14px;border-radius:4px;text-align:center}.st:nth-child(even){background:var(--dk)}.st b{display:block;font-size:30px;font-family:Anton,Impact,sans-serif;font-weight:400}.st span{font-size:12px}
.row{display:grid;grid-template-columns:2fr 1.3fr 1.2fr 1.4fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:12px 16px;margin-bottom:8px;cursor:pointer}
.row.h{background:none;border:0;cursor:default;color:var(--mut);font-size:12px;text-transform:uppercase;padding:0 16px}
.row:not(.h):hover{background:var(--dk);color:var(--cream)}.row small{color:var(--mut);display:block}.row:hover small{color:#cbb99f}
.av{width:36px;height:36px;border-radius:50%;background:var(--or);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-right:10px;vertical-align:middle;flex:none}
.stars{color:var(--gr);letter-spacing:1px}.stars i{color:#cfc5b6;font-style:normal}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--cream);color:var(--or2)}.urg{color:var(--rd);font-weight:700}
.tl{position:relative;padding:6px 0}.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--or)}
.tli{width:50%;padding:6px 26px 14px 0;position:relative}.tli.r{margin-left:50%;padding:6px 0 14px 26px}
.tli:before{content:"";position:absolute;right:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--or)}.tli.r:before{left:-6px;right:auto}
.tli .box{background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:10px 12px}.tli.r .box{text-align:left}.tli:not(.r) .box{text-align:right}
.day{width:90px;margin:6px auto;text-align:center;border:2px solid var(--or);border-radius:50%;padding:18px 4px;background:var(--bg);position:relative;font-size:12px}
@media(max-width:600px){.tl:before{left:10px}.tli,.tli.r{width:100%;margin:0;padding:6px 0 10px 30px}.tli:before,.tli.r:before{left:5px}.tli .box{text-align:left!important}.day{margin-left:0}.row{grid-template-columns:1fr 1fr}}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:3px;background:var(--card)}textarea{min-height:80px;resize:vertical}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mod>div{background:var(--card);padding:22px;border-radius:6px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--or);padding:16px}
.login .card{width:100%;max-width:360px;padding:26px}.login .logo{font-size:26px;background:var(--dk);margin-bottom:14px}
.tabs button{background:none;border:0;padding:7px 10px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}.tabs button.on{color:var(--or);border-color:var(--or)}
.it{border-left:3px solid var(--or);padding:8px 12px;margin-bottom:10px;background:var(--card);border-radius:0 4px 4px 0}.it.Email{border-color:#2f7de1}.it.Phone{border-color:var(--gr)}.it.Note{border-color:#e0b400}
.mut{color:var(--mut)}.f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body><div id="app"></div>
<script>
const K='abc_crm_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toISOString(),fd=d=>new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),day=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const ago=n=>new Date(Date.now()-n*36e5).toISOString();
function seed(){return{users:[{u:'admin',p:'admin123',name:'Admin',admin:1,pts:200,last:ago(1)},{u:'sara',p:'sara123',name:'Sara Ahmed',pts:160,last:ago(3)},{u:'omar',p:'omar123',name:'Omar Khaled',pts:120,last:ago(26)}],invited:[],
leads:[{id:1,owner:'sara',fn:'Charlie',sn:'Smith',email:'charlie@example.com',role:'Sales Manager',reason:'Met at expo',stars:3,inter:[{type:'Email',subj:'Intro',text:'Sent company profile.',date:ago(30),by:'sara'},{type:'Phone',subj:'Follow-up',text:'Call about pricing.',date:ago(20),by:'sara'}]},
{id:2,owner:'omar',fn:'Samantha',sn:'Fox',email:'sam@example.com',role:'Brand Strategist',reason:'Referral',stars:4,inter:[{type:'Meeting',subj:'Kickoff',text:'Office meeting.',date:ago(40),by:'omar'}]},
{id:3,owner:'sara',fn:'Richard',sn:'Williams',email:'rich@example.com',role:'Designer',reason:'LinkedIn',stars:2,inter:[]}],
roles:[{id:1,owner:'sara',title:'Sales Manager',desc:'Lead the sales team',pri:'Urgent',salary:'12000',date:ago(100)},{id:2,owner:'omar',title:'Brand Strategist',desc:'Brand projects',pri:'Normal',salary:'9000',date:ago(200)},{id:3,owner:'sara',title:'Designer',desc:'Visual identity',pri:'Normal',salary:'7000',date:ago(300)}],
acts:[{t:ago(30),u:'sara',txt:'Logged into the System'},{t:ago(29),u:'sara',txt:'Added a new lead: Charlie Smith'},{t:ago(26),u:'omar',txt:'Logged into the System'},{t:ago(25),u:'omar',txt:'Added a phone call with Samantha Fox'},{t:ago(2),u:'sara',txt:'Increased suitability for Richard Williams'}],nid:10}}
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
let me=null,view='dash',lid=null,q='',tab='All';
const user=u=>db.users.find(x=>x.u===u)||{name:u};
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=n=>`<span class="av">${esc(ini(n))}</span>`;
const mine=a=>me.admin?a:a.filter(x=>x.owner===me.u);
const log=txt=>{db.acts.push({t:now(),u:me.u,txt});save()};
const stars=n=>`<span class="stars">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></span>`;
const logo=`<div class="logo"><b>AMERICAN</b><b>BRAND<span class="bar"></span>CODE</b></div>`;
function loginView(err){$('#app').innerHTML=`<div class="login"><div class="card">${logo}<h2>Sign in</h2><label>Username</label><input id="lu" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"><label>Password</label><input id="lp" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><p class="urg">${err||''}</p><button class="btn" style="width:100%" id="lb">Login</button><p class="mut" style="font-size:12px">Demo: admin/admin123 · sara/sara123 · omar/omar123</p></div></div>`;
$('#lb').onclick=doLogin;$('#lp').onkeydown=e=>{if(e.key=='Enter')doLogin()}}
function doLogin(){try{const un=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value.trim();const u=db.users.find(x=>x.u===un&&x.p===pw);if(!u)return loginView('Wrong username or password');me=u;u.last=now();log('Logged into the System');view='dash';render()}catch(e){me=null;loginView('Error: '+e.message)}}
function go(v,id){view=v;lid=id||null;render();scrollTo(0,0)}
function shell(main,side){const nv=[['dash','Dashboard'],['leads','Leads'],['roles','Roles'],['team','My Team'],['set','Settings']];
return`<nav>${logo}${nv.map(([k,l])=>`<a class="${view==k||(view=='lead'&&k=='leads')?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}<span class="sp"></span><button class="btn g" onclick="addMenu()">+ Add</button><div class="srch"><input id="sq" placeholder="Search a lead..." value="${esc(q)}" onkeydown="if(event.key=='Enter'){q=this.value;go('leads')}"><button class="btn" onclick="q=$('#sq').value;go('leads')">🔍</button></div></nav><div class="wrap"><main>${main}</main><aside>${side||sideBar()}</aside></div>`}
function sideBar(){const L=mine(db.leads),top=db.users.map(u=>[u,db.leads.filter(l=>l.owner==u.u).length]).sort((a,b)=>b[1]-a[1]).slice(0,3);
const pc=Math.min(100,40+L.length*10);
return`<div class="card"><b style="color:var(--or)">${pc}%</b> profile completeness<br><span class="mut">Add leads to increase it</span></div><div class="card"><h3>Signed in</h3>${av(me.name)}<b>${esc(me.name)}</b> <span class="tag">${me.admin?'Admin':'Employee'}</span><p><button class="btn s o" onclick="me=null;loginView()">Logout</button></p></div><div class="card"><h3>Top team members</h3>${top.map(([u,n])=>`<div class="f" style="justify-content:space-between;margin-bottom:6px"><span>${av(u.name)}${esc(u.name)}</span><span class="mut">${n} leads</span></div>`).join('')}</div>`}
function render(){if(!me)return loginView();const V={dash,leads,roles,team,set:settings,lead:detail};$('#app').innerHTML=V[view]()}
function dash(){const L=mine(db.leads),R=mine(db.roles),A=db.acts.filter(a=>me.admin||a.u==me.u).slice().sort((a,b)=>b.t.localeCompare(a.t)).slice(0,30);
let h='',cd='',i=0;A.forEach(a=>{const d=day(a.t);if(d!=cd){cd=d;h+=`<div class="day">${d}</div>`}const r=i++%2;h+=`<div class="tli ${r?'r':''}"><div class="box"><b>${esc(user(a.u).name)}</b><br><span class="mut">${fd(a.t)}</span> · ${esc(a.txt)}</div></div>`});
return shell(`<h2>Welcome, ${esc(me.name)}</h2><div class="stats"><div class="st"><b>${L.length}</b><span>leads</span></div><div class="st"><b>${R.length}</b><span>open roles</span></div><div class="st"><b>${L.filter(l=>l.stars>=3).length}</b><span>suitable leads</span></div><div class="st"><b>${db.users.length}</b><span>team</span></div></div><h3>${me.admin?'Team activity':'My activity'}</h3><div class="tl">${h||'<p class="mut">No activity yet.</p>'}</div>`)}
function leads(){let L=mine(db.leads);const s=q.toLowerCase();if(s)L=L.filter(l=>(l.fn+' '+l.sn+' '+l.role+' '+l.email).toLowerCase().includes(s));
const cnt=(l,t)=>l.inter.filter(i=>i.type==t).length;
const rows=L.map(l=>`<div class="row" onclick="go('lead',${l.id})"><div>${av(l.fn+' '+l.sn)}<b>${esc(l.fn)} ${esc(l.sn)}</b><small>${me.admin?'owner: '+esc(user(l.owner).name):esc(l.email)}</small></div><div>${esc(l.role)}</div><div>${stars(l.stars)}<small>${l.stars*20}% progress</small></div><div><small>Emails (${cnt(l,'Email')}) · Phone (${cnt(l,'Phone')})<br>Meetings (${cnt(l,'Meeting')}) · Notes (${cnt(l,'Note')})</small></div></div>`).join('');
return shell(`<h2>You are viewing ${L.length} leads ${s?`<button class="btn s o" onclick="q='';render()">clear “${esc(q)}”</button>`:''}</h2><div class="row h"><span>Name</span><span>Role</span><span>Suitability</span><span>Relationship</span></div>${rows||'<p class="mut">No leads found.</p>'}`,`<div class="card"><h3>Quick add a lead</h3>${leadForm()}<button class="btn g" style="margin-top:10px" onclick="saveLead()">Add the lead</button></div>`)}
function leadForm(){const R=mine(db.roles);return`<input id="lf" placeholder="First name"><input id="ls" placeholder="Surname" style="margin-top:6px"><input id="le" placeholder="E-mail" style="margin-top:6px"><select id="lr" style="margin-top:6px"><option value="">Role I'm adding lead for</option>${R.map(r=>`<option>${esc(r.title)}</option>`).join('')}</select><textarea id="lx" placeholder="Reason I'm adding this lead" style="margin-top:6px"></textarea><input id="li" placeholder="LinkedIn" style="margin-top:6px"><input id="lt" placeholder="Twitter" style="margin-top:6px">`}
function saveLead(){const fn=$('#lf').value.trim();if(!fn)return alert('First name is required');const l={id:db.nid++,owner:me.u,fn,sn:$('#ls').value.trim(),email:$('#le').value.trim(),role:$('#lr').value||'—',reason:$('#lx').value,li:$('#li').value,tw:$('#lt').value,stars:1,inter:[]};db.leads.push(l);log('Added a new lead: '+fn+' '+l.sn);closeM();go('leads')}
function roles(){const R=mine(db.roles);return shell(`<h2>You have ${R.length} open positions</h2><div class="row h" style="grid-template-columns:1fr 2fr 1fr 1fr"><span>Priority</span><span>Position</span><span>Leads</span><span>Open on</span></div>${R.map(r=>`<div class="row" style="grid-template-columns:1fr 2fr 1fr 1fr" onclick="delRole(${r.id})" title="Click to archive"><span class="${r.pri=='Urgent'?'urg':''}">⚑ ${r.pri}</span><div><b>${esc(r.title)}</b><small>${esc(r.desc)}${r.salary?' · '+esc(r.salary):''}</small></div><span>${db.leads.filter(l=>l.role==r.title).length} leads</span><span>${day(r.date)}</span></div>`).join('')||'<p class="mut">No roles yet.</p>'}`,`<button class="btn g" style="width:100%;margin-bottom:14px" onclick="roleM()">+ Add new role</button>`+sideBar())}
function roleM(){modal(`<h2>Add a new role</h2><input id="rt" placeholder="Role Title"><textarea id="rd" placeholder="Description of the role" style="margin-top:8px"></textarea><div class="f" style="margin:10px 0"><label style="margin:0">Priority:</label><select id="rp" style="width:auto"><option>Normal</option><option>Urgent</option></select></div><input id="rs" placeholder="Salary"><label><input type="checkbox" id="rn" style="width:auto"> Send an announcement via e-mail to my team</label><br><button class="btn" onclick="saveRole()">Add role</button>`)}
function saveRole(){const t=$('#rt').value.trim();if(!t)return alert('Title required');db.roles.push({id:db.nid++,owner:me.u,title:t,desc:$('#rd').value,pri:$('#rp').value,salary:$('#rs').value,date:now()});log('Added a new role: '+t);closeM();render()}
function delRole(id){if(confirm('Archive this role?')){db.roles=db.roles.filter(r=>r.id!=id);save();render()}}
function team(){const U=me.admin?db.users:[me];return shell(`<h2>My Team</h2>${U.map(u=>`<div class="row" style="grid-template-columns:2fr 1fr 1.4fr 1fr;cursor:default"><div>${av(u.name)}<b>${esc(u.name)}</b><small>last login: ${day(u.last)}</small></div><span>${db.leads.filter(l=>l.owner==u.u).length} leads</span><span>${fd(u.last)}</span><span class="stars">${'★'.repeat(Math.ceil(u.pts/80))}<br><small class="mut">${u.pts} points</small></span></div>`).join('')}${me.admin&&db.invited.length?'<h3>Invited coworkers</h3>'+db.invited.map(i=>`<div class="card f" style="justify-content:space-between">${esc(i.name)} <span class="mut">⚑ pending sign up · ${day(i.date)}</span></div>`).join(''):''}`,me.admin?`<button class="btn g" style="width:100%;margin-bottom:14px" onclick="inviteM()">+ Invite new member</button>`+sideBar():sideBar())}
function inviteM(){modal(`<h2>Invite a coworker</h2><input id="iu" placeholder="Full name"><input id="ie" placeholder="Username" style="margin-top:8px"><input id="ip" placeholder="Temporary password" style="margin-top:8px"><textarea id="im" placeholder="Personalised message" style="margin-top:8px"></textarea><br><button class="btn g" onclick="invite()">Send invite</button>`)}
function invite(){const n=$('#iu').value.trim(),u=$('#ie').value.trim().toLowerCase(),p=$('#ip').value;if(!n||!u||!p)return alert('Fill all fields');if(db.users.some(x=>x.u==u))return alert('Username exists');db.users.push({u,p,name:n,pts:0,last:now()});db.invited.push({name:n,date:now()});log('Invited a coworker: '+n);closeM();render()}
function settings(){return shell(`<h2>Settings</h2><div class="card"><h3>Change password</h3><input id="np" type="password" placeholder="New password"><br><br><button class="btn" onclick="if($('#np').value.length>3){me.p=$('#np').value;save();alert('Updated')}">Update</button></div>${me.admin?`<div class="card"><h3>Data</h3><button class="btn o" onclick="if(confirm('Reset all demo data?')){db=seed();save();me=null;loginView()}">Reset demo data</button></div>`:''}`)}
function detail(){const l=db.leads.find(x=>x.id==lid);if(!l||(!me.admin&&l.owner!=me.u))return go('leads');
const T=['All','Email','Phone','Meeting','Social','Note'],I=l.inter.filter(i=>tab=='All'||i.type==tab).slice().reverse();
return shell(`<p><a class="mut" style="cursor:pointer" onclick="go('leads')">← Back to leads</a></p><div class="card f" style="gap:16px"><span class="av" style="width:70px;height:70px;font-size:24px">${esc(ini(l.fn+' '+l.sn))}</span><div style="flex:1"><h2 style="margin:0">${esc(l.fn)} ${esc(l.sn)}</h2><span class="mut">${esc(l.email)} · ${esc(l.role)}</span><br><span class="mut">Proposed by ${esc(user(l.owner).name)}</span>${l.li?`<br><span class="mut">LinkedIn: ${esc(l.li)}</span>`:''}</div><div>Suitability<br>${stars(l.stars)}<br><button class="btn s o" onclick="suit(${l.id},1)">▲</button> <button class="btn s o" onclick="suit(${l.id},-1)">▼</button></div></div>${l.reason?`<div class="card" style="background:#fff7b8;color:#333"><b>Reason for adding:</b> ${esc(l.reason)}</div>`:''}<div class="f" style="justify-content:space-between"><div class="tabs">${T.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><button class="btn s" onclick="interM(${l.id})">Add new interaction</button></div><br>${I.map(i=>`<div class="it ${i.type}"><b>${esc(i.subj)}</b> <span class="tag">${i.type}</span> <span class="mut">${fd(i.date)} · ${esc(user(i.by).name)}</span><p style="margin:6px 0 0">${esc(i.text)}</p></div>`).join('')||'<p class="mut">No interactions yet.</p>'}<div class="card"><h3>Send a reply</h3><input id="rsu" placeholder="Subject"><textarea id="rtx" placeholder="Your message" style="margin-top:8px"></textarea><br><button class="btn s" onclick="reply(${l.id})">Reply</button></div>`)}
function suit(id,d){const l=db.leads.find(x=>x.id==id),n=Math.max(0,Math.min(5,l.stars+d));if(n==l.stars)return;l.stars=n;log((d>0?'Increased':'Decreased')+' suitability for '+l.fn+' '+l.sn);render()}
function interM(id){modal(`<h2>Add new interaction</h2><input id="is" placeholder="Subject of interaction"><select id="it" style="margin-top:8px"><option>Email</option><option>Phone</option><option>Meeting</option><option>Social</option><option>Note</option></select><textarea id="ix" placeholder="Details (optional)" style="margin-top:8px"></textarea><br><button class="btn" onclick="addI(${id},$('#it').value,$('#is').value,$('#ix').value)">Add interaction</button>`)}
function addI(id,type,subj,text){if(!subj.trim())return alert('Subject required');const l=db.leads.find(x=>x.id==id);l.inter.push({type,subj,text,date:now(),by:me.u});log(`Added a ${type.toLowerCase()} interaction with ${l.fn} ${l.sn}`);closeM();render()}
function reply(id){const s=$('#rsu').value,t=$('#rtx').value;if(!t.trim())return;addI(id,'Email',s||'(no subject)',t)}
function addMenu(){modal(`<h2>Quick add</h2><div class="f"><button class="btn" onclick="closeM();go('leads');setTimeout(()=>$('#lf')&&$('#lf').focus(),50)">New lead</button><button class="btn" onclick="closeM();roleM()">New role</button>${me.admin?'<button class="btn" onclick="closeM();inviteM()">Invite member</button>':''}</div>`)}
function modal(h){closeM();const m=document.createElement('div');m.className='mod';m.id='mod';m.innerHTML='<div>'+h+'<p><button class="btn s o" onclick="closeM()">Cancel</button></p></div>';m.onclick=e=>e.target==m&&closeM();document.body.appendChild(m)}
function closeM(){const m=$('#mod');m&&m.remove()}
